<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2400" viewBox="0 0 1200 2400" aria-label="Spatial proteomics cross-cohort cell typing pipeline flowchart">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: bold 18px Arial, Helvetica, sans-serif; fill:#111; }
      .box-title { font: bold 14px Arial, Helvetica, sans-serif; fill:#000; }
      .box-sub { font: 11px Arial, Helvetica, sans-serif; fill:#111; }
      .phase-label { font: bold 13px Arial, Helvetica, sans-serif; fill:#fff; }
      .arrow { stroke: #222; stroke-width: 6; fill: none; marker-end: url(#arrowhead); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-thin { stroke: #444; stroke-width: 2; fill:none; marker-end: url(#arrowheadThin); stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:4 4; }
      .box { fill:#fff; stroke:#333; stroke-width:1.5; rx:8; ry:8; }
      .box-highlight { stroke:#d33; stroke-width:4; stroke-dasharray:8 6; filter:url(#glow); }
      .star { fill:#ffcc00; stroke:#d99400; stroke-width:1.5; }
      .stat-box { fill:#ffffffcc; stroke:#444; stroke-width:1; rx:10; ry:10; }
      .legend-box { fill:#ffffffee; stroke:#444; stroke-width:1; rx:6; ry:6; }
      .phase-band { rx:6; ry:6; stroke:#00000022; stroke-width:1; }
    ]]></style>

    <!-- Arrowheads -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222" />
    </marker>
    <marker id="arrowheadThin" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444" />
    </marker>

    <!-- Simple glow filter for highlights -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff6666" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Page title -->
  <text x="60" y="36" class="title">Spatial proteomics cross-cohort cell-typing pipeline — Methodology flowchart</text>

  <!-- Top-right stats box -->
  <g transform="translate(860,8)" aria-hidden="true">
    <rect x="0" y="0" width="320" height="72" class="stat-box"/>
    <text x="12" y="22" class="box-title">5 Cohorts | 5.27M Cells</text>
    <text x="12" y="42" class="box-sub">102 Markers (19 Backbone) | 3 Platforms (CODEX, MIBI‑TOF, IMC)</text>
  </g>

  <!-- Phase bands: 4 horizontal layers with distinct colors -->
  <!-- Phase 1 (Data Prep) -->
  <rect x="40" y="80" width="1120" height="420" fill="#3a84d8" class="phase-band"/>
  <text x="60" y="110" class="phase-label">Phase 1 — Data Preparation & Preprocessing</text>

  <!-- Phase 2 (Spatial Construction) -->
  <rect x="40" y="520" width="1120" height="420" fill="#38a83a" class="phase-band"/>
  <text x="60" y="550" class="phase-label">Phase 2 — Spatial Neighborhood Construction</text>

  <!-- Phase 3 (Feature Eng) -->
  <rect x="40" y="960" width="1120" height="420" fill="#f29c2e" class="phase-band"/>
  <text x="60" y="990" class="phase-label">Phase 3 — Spatial Feature Engineering</text>

  <!-- Phase 4 (Model Training) -->
  <rect x="40" y="1400" width="1120" height="700" fill="#b23a7a" class="phase-band"/>
  <text x="60" y="1430" class="phase-label">Phase 4 — Model Training & Evaluation</text>

  <!-- Phase 1 content -->
  <!-- Input box: 5 Raw Cohorts -->
  <g transform="translate(120,130)">
    <rect class="box" x="0" y="0" width="960" height="72"/>
    <text x="16" y="24" class="box-title">Input — Raw cohorts</text>
    <text x="16" y="44" class="box-sub">CRC, HubMap, Keren, UPMC, Ferguson</text>
  </g>

  <!-- Sub-steps 1.1 to 1.4 -->
  <g transform="translate(160,220)">
    <rect class="box" x="0" y="0" width="420" height="60"/>
    <text x="12" y="20" class="box-title">1.1 Marker harmonization</text>
    <text x="12" y="40" class="box-sub">→ 102 Standard markers / 19 Backbone</text>

    <rect class="box" x="520" y="0" width="420" height="60"/>
    <text x="532" y="20" class="box-title">1.2 Cross‑platform normalization</text>
    <text x="532" y="40" class="box-sub">Rank + 2‑component GMM → P(positive) ∈ [0,1]</text>

    <rect class="box" x="0" y="92" width="420" height="60"/>
    <text x="12" y="112" class="box-title">1.3 Geometry scaling</text>
    <text x="12" y="132" class="box-sub">Pixel → micrometres (µm)</text>

    <rect class="box" x="520" y="92" width="420" height="60"/>
    <text x="532" y="112" class="box-title">1.4 Label curation & QC</text>
    <text x="532" y="132" class="box-sub">L1: 3 classes | L2: 9 classes — filter Gold & Clean</text>
  </g>

  <!-- Output box for Phase 1 -->
  <g transform="translate(300,320)">
    <rect class="box" x="0" y="0" width="600" height="64"/>
    <text x="16" y="22" class="box-title">Output — Per‑cohort model tables</text>
    <text x="16" y="44" class="box-sub">harmonised/model/{cohort}_model.parquet</text>
  </g>

  <!-- Arrow Phase1 -> Phase2 -->
  <path d="M600 400 L600 520" class="arrow" />

  <!-- Phase 2 content -->
  <!-- Input header -->
  <g transform="translate(120,560)">
    <rect class="box" x="0" y="0" width="960" height="58"/>
    <text x="16" y="20" class="box-title">Input — Cell coordinates + processed expression</text>
    <text x="16" y="40" class="box-sub">Per-cell x_um, y_um and P(positive) markers</text>
  </g>

  <!-- Dual graph boxes side by side -->
  <g transform="translate(180,640)">
    <!-- r30 -->
    <rect class="box" x="0" y="0" width="420" height="84"/>
    <text x="12" y="26" class="box-title">r30 — Radius graph (primary)</text>
    <text x="12" y="48" class="box-sub">Radius = 30 µm • density‑sensitive</text>

    <!-- k10 -->
    <rect class="box" x="520" y="0" width="420" height="84"/>
    <text x="532" y="26" class="box-title">k10 — kNN graph (secondary)</text>
    <text x="532" y="48" class="box-sub">k = 10 • density‑invariant</text>

    <!-- Highlight dual graph: dashed red border + star -->
    <rect x="-8" y="-8" width="956" height="100" class="box-highlight" />
    <!-- star icon near top-left of the highlight -->
    <g transform="translate(920, -20) scale(0.9)">
      <path class="star" d="M12 2 L15.4 8.6 L22.6 9.6 L17 14.2 L18.6 21.4 L12 18 L5.4 21.4 L7 14.2 L1.4 9.6 L8.6 8.6 Z"/>
    </g>
  </g>

  <!-- Output adjacency matrices -->
  <g transform="translate(430,740)">
    <rect class="box" x="0" y="0" width="340" height="54"/>
    <text x="12" y="20" class="box-title">Output — Adjacency matrices / graph edges</text>
    <text x="12" y="38" class="box-sub">Edge lists with dist_um (src &lt; dst)</text>
  </g>

  <!-- Arrow Phase2 -> Phase3 -->
  <path d="M600 820 L600 960" class="arrow" />

  <!-- Phase 3 content -->
  <!-- Input header -->
  <g transform="translate(120,1000)">
    <rect class="box" x="0" y="0" width="960" height="58"/>
    <text x="16" y="20" class="box-title">Input — Neighborhood graphs + marker expressions</text>
  </g>

  <!-- Feature blocks: arranged in two rows of three -->
  <g transform="translate(120,1080)">
    <!-- nb_mean_marker (dominant) -->
    <rect class="box" x="0" y="0" width="340" height="78"/>
    <text x="12" y="24" class="box-title">nb_mean_marker</text>
    <text x="12" y="44" class="box-sub">Neighbourhood mean of neighbor marker P(positive)</text>
    <!-- highlight nb_mean -->
    <rect x="-6" y="-6" width="352" height="90" class="box-highlight"/>

    <!-- nb_std_marker -->
    <rect class="box" x="380" y="0" width="340" height="78"/>
    <text x="392" y="24" class="box-title">nb_std_marker</text>
    <text x="392" y="44" class="box-sub">Neighbourhood heterogeneity (SD) — backbone only</text>

    <!-- density_30um -->
    <rect class="box" x="760" y="0" width="220" height="78"/>
    <text x="772" y="24" class="box-title">density_30um</text>
    <text x="772" y="44" class="box-sub">Local cell crowding (degree in r30)</text>

    <!-- img_mean_marker -->
    <rect class="box" x="0" y="100" width="340" height="78"/>
    <text x="12" y="124" class="box-title">img_mean_marker</text>
    <text x="12" y="144" class="box-sub">Whole‑image average profile</text>

    <!-- img_pos_marker -->
    <rect class="box" x="380" y="100" width="340" height="78"/>
    <text x="392" y="124" class="box-title">img_pos_marker</text>
    <text x="392" y="144" class="box-sub">Whole‑image positivity rates</text>

    <!-- micro_env -->
    <rect class="box" x="760" y="100" width="220" height="78"/>
    <text x="772" y="124" class="box-title">micro_env (k=15)</text>
    <text x="772" y="144" class="box-sub">Shared cross‑cohort neighborhood cluster ID</text>
  </g>

  <!-- Output full feature vectors -->
  <g transform="translate(300,1268)">
    <rect class="box" x="0" y="0" width="600" height="64"/>
    <text x="16" y="24" class="box-title">Output — Full feature vectors</text>
    <text x="16" y="44" class="box-sub">Markers + Spatial blocks + Mask flags</text>
  </g>

  <!-- Arrow Phase3 -> Phase4 -->
  <path d="M600 1332 L600 1400" class="arrow" />

  <!-- Phase 4 content -->
  <!-- Input header -->
  <g transform="translate(120,1440)">
    <rect class="box" x="0" y="0" width="960" height="58"/>
    <text x="16" y="20" class="box-title">Input — Feature vectors + Labels + Confidence weights</text>
  </g>

  <!-- Model box (left) -->
  <g transform="translate(120,1520)">
    <rect class="box" x="0" y="0" width="520" height="140"/>
    <text x="12" y="24" class="box-title">4.1 Model — HistGradientBoostingClassifier</text>
    <text x="12" y="46" class="box-sub">NaN-native classifier • class_weight='balanced'</text>
    <text x="12" y="66" class="box-sub">sample_weight = label_confidence</text>
    <!-- Mask Mechanism highlighted inside Model box -->
    <rect x="280" y="78" width="220" height="44" class="box-highlight"/>
    <text x="290" y="98" class="box-sub">Mask Mechanism: NaN + Mask flag (0=Unmeasured,1=Measured)</text>
    <!-- star icon for Mask -->
    <g transform="translate(500,155) scale(0.9)">
      <path class="star" d="M12 2 L15.4 8.6 L22.6 9.6 L17 14.2 L18.6 21.4 L12 18 L5.4 21.4 L7 14.2 L1.4 9.6 L8.6 8.6 Z"/>
    </g>
  </g>

  <!-- Training strategy box (right) -->
  <g transform="translate(680,1520)">
    <rect class="box" x="0" y="0" width="400" height="180"/>
    <text x="12" y="24" class="box-title">4.2 Training strategy</text>
    <text x="12" y="46" class="box-sub">LOCO: Train 4 cohorts → Test held-out 5th (rotate 5 folds)</text>
    <text x="12" y="66" class="box-sub">Within‑cohort splits: random & patient‑wise (ceiling estimate)</text>

    <!-- Highlight LOCO -->
    <rect x="6" y="34" width="388" height="32" class="box-highlight"/>
    <text x="14" y="56" class="box-sub" fill="#800000">★ LOCO (Leave-One-Cohort-Out) — core validation innovation</text>
    <!-- star for LOCO -->
    <g transform="translate(430,168) scale(0.9)">
      <path class="star" d="M12 2 L15.4 8.6 L22.6 9.6 L17 14.2 L18.6 21.4 L12 18 L5.4 21.4 L7 14.2 L1.4 9.6 L8.6 8.6 Z"/>
    </g>
  </g>

  <!-- Output box: Metrics and Ablation -->
  <g transform="translate(300,1680)">
    <rect class="box" x="0" y="0" width="600" height="64"/>
    <text x="16" y="24" class="box-title">Output — Evaluation</text>
    <text x="16" y="44" class="box-sub">Macro‑F1 (L1 & L2) • Ablation importance ranking</text>
  </g>

  <!-- Thick solid arrows from Feature output to Model and Training -->
  <path d="M600 1400 L380 1520" class="arrow" />
  <path d="M600 1400 L1080 1520" class="arrow" />

  <!-- Dotted thin feedback loop: Evaluation -> Model (hyperparameter tuning) -->
  <path d="M600 1744 C600 1880, 520 1960, 380 2000" class="arrow-thin" />
  <path d="M380 2000 L380 1600" class="arrow-thin" />
  <text x="420" y="2008" class="box-sub" fill="#444">Hyperparameter tuning loop (dotted)</text>

  <!-- Highlight Dual Graph: Add small label with star near the highlight (already added) -->
  <text x="860" y="740" class="box-sub" fill="#750000">★ Dual Graph (r30 & k10)</text>

  <!-- Highlight nb_mean label (already highlighted) -->
  <text x="20" y="1206" class="box-sub" fill="#750000">★ Dominant feature: nb_mean</text>

  <!-- Legend bottom-left -->
  <g transform="translate(60,2200)">
    <rect x="0" y="0" width="320" height="140" class="legend-box"/>
    <text x="12" y="20" class="box-title">Legend</text>
    <!-- color keys -->
    <rect x="12" y="32" width="18" height="14" fill="#3a84d8" stroke="#00000022"/>
    <text x="36" y="44" class="box-sub">Phase 1 — Prep</text>

    <rect x="12" y="56" width="18" height="14" fill="#38a83a" stroke="#00000022"/>
    <text x="36" y="68" class="box-sub">Phase 2 — Spatial</text>

    <rect x="12" y="80" width="18" height="14" fill="#f29c2e" stroke="#00000022"/>
    <text x="36" y="92" class="box-sub">Phase 3 — Features</text>

    <rect x="12" y="104" width="18" height="14" fill="#b23a7a" stroke="#00000022"/>
    <text x="36" y="116" class="box-sub">Phase 4 — Training</text>
  </g>

  <!-- Footer note for typography -->
  <text x="60" y="2368" class="box-sub">Typography: Arial/Helvetica; Box titles bold 14pt; sub-steps 11pt. Thick arrows indicate main dataflow.</text>
</svg>
